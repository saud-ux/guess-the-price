<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خمّن السعر - اللعب</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="player-body">

  <div class="player-card">

    <!-- شاشة الانضمام -->
    <div id="screen-join" class="screen active">
      <h1 class="logo" style="font-size:1.6rem; margin-bottom:20px;">خمّن السعر 💰</h1>

      <div class="input-group">
        <label>كود الغرفة</label>
        <input type="text" id="room-code-input" maxlength="4" inputmode="numeric" pattern="[0-9]*"
               placeholder="أدخل الكود" dir="ltr" style="text-align:center; font-size:1.8rem; font-weight:800; letter-spacing:8px;">
      </div>

      <div class="input-group">
        <label>اسمك</label>
        <input type="text" id="player-name-input" placeholder="أدخل اسمك" maxlength="20">
      </div>

      <button class="btn btn-primary btn-full" id="btn-join" style="font-size:1.1rem; padding:14px;">
        انضم
      </button>

      <div id="join-error" style="color:var(--red); text-align:center; margin-top:12px; display:none;"></div>
    </div>

    <!-- شاشة الانتظار -->
    <div id="screen-waiting" class="screen">
      <div class="waiting">
        <div class="spinner"></div>
        <h2 style="margin-bottom:8px;">تم الانضمام!</h2>
        <p style="color:var(--text-muted);">بانتظار بدء الجولة...</p>
      </div>
    </div>

    <!-- شاشة التخمين -->
    <div id="screen-guess" class="screen">
      <div class="round-header" style="justify-content:center; gap:16px;">
        <span class="round-badge">الجولة <span id="p-round-num">1</span>/<span id="p-total-rounds">10</span></span>
        <div class="timer-circle" id="p-timer-circle" style="width:60px; height:60px; font-size:1.5rem; border-width:4px;">
          <span id="p-timer-value">20</span>
        </div>
      </div>

      <div style="text-align:center; margin:16px 0;">
        <div style="color:var(--text-muted); font-size:0.9rem;">كم سعر</div>
        <div class="product-name" id="p-product-name" style="font-size:1.4rem; margin:8px 0;"></div>
        <div style="color:var(--gold); font-size:0.9rem;">(<span id="p-currency"></span>)</div>
      </div>

      <div class="input-group">
        <label>تخمينك</label>
        <input type="number" id="guess-input" class="player-guess-input"
               inputmode="decimal" placeholder="0" dir="ltr" min="1" step="any">
      </div>

      <button class="btn btn-primary btn-full" id="btn-submit-guess" style="font-size:1.2rem; padding:14px;">
        أرسل
      </button>

      <div class="player-hint warning">⚠️ أول تخمين فقط يُحتسب!</div>
      <div class="player-hint">💡 الأقرب بدون تجاوز يفوز</div>
    </div>

    <!-- شاشة تم التخمين -->
    <div id="screen-guessed" class="screen">
      <div class="guess-confirmed">
        <div class="checkmark">✅</div>
        <div style="margin-bottom:8px;">تخمينك:</div>
        <div class="value" id="guessed-value"></div>
        <div style="color:var(--text-muted); margin-top:16px;">
          <div class="spinner" style="width:32px; height:32px; border-width:3px;"></div>
          بانتظار النتيجة...
        </div>
      </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="screen-player-result" class="screen">
      <div class="player-result-card">
        <div id="p-result-content"></div>
        <div style="margin-top:16px; color:var(--text-muted);">بانتظار الجولة التالية...</div>
      </div>
    </div>

    <!-- شاشة النهاية -->
    <div id="screen-player-gameover" class="screen">
      <div style="text-align:center;">
        <h2 class="logo" style="font-size:1.4rem;">انتهت اللعبة! 🏆</h2>
        <div id="p-final-result"></div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="player.js"></script>
</body>
</html>
